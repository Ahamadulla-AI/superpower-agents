[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superpower-agents"
version = "0.1.0"
description = "Reusable agent skills and a gated agentic development workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["agents", "skills", "llm", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai>=1.0",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
superpower-agents = "superpowers_agent.cli:main"
superpowers = "superpowers_agent.workflow_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/superpowers_agent"]
include = ["src/superpowers_agent/skills/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
